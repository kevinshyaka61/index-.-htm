<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Level</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            margin: 0;
            padding: 30px 15px;
            color: #18324f;
        }

        header {
            background: #124b91;
            color: white;
            text-align: center;
            padding: 25px 10px;
            border-radius: 10px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }

        .levels {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .levels a {
            background: #1769c2;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 7px;
            font-weight: bold;
        }

        .levels a:hover {
            background: #0b3d78;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #52677f;
            font-size: 14px;
        }
        .back-btn {
               background: #1769c2;
               color: white;
               text-decoration: none;
               padding: 15px 30px;
               border-radius: 7px;
                font-weight: bold;
                 display: inline-block;
        } 

        .back-btn:hover {
            background: #0b3d78;
}
    </style>
</head>
<body>

    <header>
        <h1>Choose Your Level</h1>
        <p>Select the level you are studying.</p>
    </header>

    <div class="container">
        <h2>Which level are you in?</h2>
        <p>Choose your level to view the available class timetables.</p>

        <div class="levels">
            <a href="L3 MULT TABLE (1).HTML">Level 3</a>
            <a href="L4 MULT.HTML">Level 4</a>
            <a href="L5 MULT.HTML">Level 5</a>
        </div>
    </div>

    <footer>
        <a class="back-btn" href="simple_homepage.html">BACK</a>
        <p>Class Timetable Page</p>
    </footer>

</body>
</html>
